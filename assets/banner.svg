<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="vector-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <style>
    /* Dynamic vector pulses and floating elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { r: 3.5px; fill-opacity: 0.8; }
      50% { r: 5.5px; fill-opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }

    .orb-1 { animation: floatOrb1 12s ease-in-out infinite, pulseGlow 8s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: floatOrb2 14s ease-in-out infinite, pulseGlow 10s ease-in-out infinite; transform-origin: center; }
    .vector-line { stroke-dasharray: 6 6; animation: dashMove 15s linear infinite; }
    .radar-beam { animation: scanline 7s ease-in-out infinite; }
    .dynamic-node { animation: nodeBlink 3.5s ease-in-out infinite; }
    .node-delay-1 { animation-delay: 1.2s; }
    .node-delay-2 { animation-delay: 2.1s; }
    .node-delay-3 { animation-delay: 0.7s; }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Glowing Orbs in the background -->
  <g class="orb-1" opacity="0.3">
    <circle cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#soft-glow)" />
    <circle cx="1020" cy="270" r="160" fill="#818cf8" filter="url(#soft-glow)" />
  </g>
  <g class="orb-2" opacity="0.25">
    <circle cx="880" cy="80" r="130" fill="#c084fc" filter="url(#soft-glow)" />
    <circle cx="150" cy="300" r="120" fill="#06b6d4" filter="url(#soft-glow)" />
  </g>

  <!-- Vector Grid Pattern Layer -->
  <rect width="100%" height="100%" fill="url(#vector-grid)" />

  <!-- Dynamic Vector Graph Network Lines in Background (Non-Obstructing) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2">
    <!-- Graph Edges / HNSW Mesh Simulation -->
    <line x1="80" y1="70" x2="220" y2="40" class="vector-line" />
    <line x1="220" y1="40" x2="360" y2="90" class="vector-line" />
    <line x1="940" y1="60" x2="1080" y2="100" class="vector-line" />
    <line x1="1080" y1="100" x2="1140" y2="240" class="vector-line" />
    <line x1="880" y1="280" x2="1040" y2="310" class="vector-line" />
    <line x1="70" y1="290" x2="210" y2="330" class="vector-line" />
    <line x1="210" y1="330" x2="310" y2="270" class="vector-line" />

    <!-- Connecting Dynamic Nodes -->
    <circle cx="80" cy="70" r="4" fill="#38bdf8" class="dynamic-node" />
    <circle cx="220" cy="40" r="4" fill="#818cf8" class="dynamic-node node-delay-1" />
    <circle cx="360" cy="90" r="4" fill="#c084fc" class="dynamic-node node-delay-2" />
    <circle cx="940" cy="60" r="4" fill="#38bdf8" class="dynamic-node node-delay-3" />
    <circle cx="1080" cy="100" r="4" fill="#818cf8" class="dynamic-node node-delay-1" />
    <circle cx="1140" cy="240" r="4" fill="#c084fc" class="dynamic-node node-delay-2" />
    <circle cx="880" cy="280" r="4" fill="#38bdf8" class="dynamic-node node-delay-3" />
    <circle cx="1040" cy="310" r="4" fill="#818cf8" class="dynamic-node node-delay-1" />
    <circle cx="70" cy="290" r="4" fill="#06b6d4" class="dynamic-node node-delay-2" />
    <circle cx="210" cy="330" r="4" fill="#38bdf8" class="dynamic-node node-delay-3" />
  </g>

  <!-- Ambient Sweeping Scanner Laser Beam -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#primary-grad)" stroke-width="1.5" stroke-opacity="0.4" class="radar-beam" />

  <!-- Central Visual Container / Glassmorphism Backdrop for Clear Foreground Text -->
  <rect x="140" y="38" width="920" height="284" rx="20" fill="url(#card-grad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1" filter="url(#glow)" />

  <!-- Badge / Eyebrow Pill -->
  <g transform="translate(425, 62)">
    <rect width="350" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" />
    <text x="32" y="20" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title with Gradient fill -->
    <text x="600" y="142" fill="url(#primary-grad)" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome Search, Retrieval &amp; Vector Indexing
    </text>

    <!-- Subtitle description -->
    <text x="600" y="184" fill="#e2e8f0" font-size="17" font-weight="400">
      Vector Databases • ANN Similarity Search • Hybrid BM25 &amp; Dense Retrieval • RAG Pipelines
    </text>

    <text x="600" y="212" fill="#94a3b8" font-size="13.5" font-weight="400">
      Enterprise Cloud Infrastructure, Columnar Lance Formats &amp; High-Performance Open-Source Engines
    </text>
  </g>

  <!-- Architectural Feature Badges / Spec Pills in Foreground -->
  <g transform="translate(195, 246)">
    <!-- Pill 1: Vector DBs -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="90" y="21" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">⚡ VECTOR DATABASES</text>
      <text x="90" y="34" fill="#64748b" font-size="9.5" font-weight="500" text-anchor="middle">Milvus • Qdrant • Weaviate</text>
    </g>

    <!-- Pill 2: Hybrid Search & BM25 -->
    <g transform="translate(205, 0)">
      <rect width="190" height="42" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="95" y="21" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">🔍 HYBRID &amp; BM25 RETRIEVAL</text>
      <text x="95" y="34" fill="#64748b" font-size="9.5" font-weight="500" text-anchor="middle">Elastic • Typesense • Meilisearch</text>
    </g>

    <!-- Pill 3: ANN & Embedded Engines -->
    <g transform="translate(420, 0)">
      <rect width="195" height="42" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="97" y="21" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">🧠 HIGH-SCALE ANN &amp; HNSW</text>
      <text x="97" y="34" fill="#64748b" font-size="9.5" font-weight="500" text-anchor="middle">FAISS • pgvector • USearch</text>
    </g>

    <!-- Pill 4: Incremental & RAG Pipelines -->
    <g transform="translate(640, 0)">
      <rect width="170" height="42" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="85" y="21" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">🚀 RAG PIPELINES</text>
      <text x="85" y="34" fill="#64748b" font-size="9.5" font-weight="500" text-anchor="middle">CocoIndex • LanceDB • txtai</text>
    </g>
  </g>
</svg>
